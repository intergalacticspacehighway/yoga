<div
  id="grid_basic_absolute_placement"
  style="
    display: grid;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    padding: 20px;
    border: 1px solid black;
  ">
  <div
    style="
      position: absolute;
      width: 50px;
      height: 50px;
      grid-column-start: 2;
      grid-column-end: 3;
      grid-row-start: 2;
      grid-row-end: 4;
      top: 20px;
      left: 10px;
    "></div>
</div>
